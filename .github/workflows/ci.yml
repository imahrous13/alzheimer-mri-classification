name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas Pillow scipy scikit-learn scikit-image matplotlib seaborn joblib tqdm
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest ruff streamlit

      - name: Lint (ruff)
        run: ruff check src scripts tests app.py

      - name: Compile check
        run: python -m compileall -q src scripts tests app.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q
